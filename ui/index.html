<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>AURORA</title>
    <!--
      No inline script and no inline style: the static route sends
      `script-src 'self'` and `style-src 'self'`, so an inline handler would be
      blocked — and an injected one could not run (ADR 012 §3).
    -->
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>AURORA</h1>
        <span class="sub">Autonomous Unified Research &amp; Operations Runtime</span>
      </div>
      <div class="conn-wrap">
        <span id="conn-status" class="conn">connecting…</span>
      </div>
    </header>

    <div id="token-row" class="token-row hidden">
      <label for="token-input">API token</label>
      <input id="token-input" type="password" autocomplete="off" placeholder="AURORA_API_TOKEN" />
      <button id="token-save" type="button">Use token</button>
      <span class="muted">
        Kept in this tab's sessionStorage only; sent as a header, never in a URL.
      </span>
    </div>

    <nav class="tabs">
      <button data-view="tasks" type="button">Tasks</button>
      <button data-view="agents" type="button">Agents</button>
      <button data-view="knowledge" type="button">Knowledge</button>
    </nav>

    <main>
      <section class="panel list">
        <div class="toolbar">
          <form id="task-form" class="hidden">
            <input
              id="task-input"
              type="text"
              placeholder="Start a run… (mutation is denied unless the server opted in)"
              autocomplete="off"
            />
            <button type="submit">Run</button>
          </form>
          <select id="task-filter" aria-label="Filter by status"></select>
          <select id="knowledge-filter" class="hidden" aria-label="Filter by kind"></select>
        </div>
        <div id="content" class="content"></div>
      </section>
      <section class="panel detail">
        <div id="detail" class="content"></div>
      </section>
    </main>

    <footer>
      <span class="muted">
        Rendered as text only — agent output and knowledge content are untrusted data.
      </span>
    </footer>

    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
